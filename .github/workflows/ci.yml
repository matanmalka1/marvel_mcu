name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcu-watch-tracker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcu-watch-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify codebase
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
